name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    env:
      VCPKG_ROOT: C:\vcpkg
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake --preset default

      - name: Build
        run: cmake --build --preset release --parallel --target EveOverlay

      - name: Package
        shell: pwsh
        run: ./package.ps1 -Version ("${{ github.ref_name }}" -replace '^v', '')

      - uses: actions/upload-artifact@v4
        with:
          name: EveOverlay-win64
          path: dist/*.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
